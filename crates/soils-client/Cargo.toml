[package]
name = "soils-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
soils-protocol = { workspace = true }
soils-sim = { workspace = true }
soils-worldgen = { workspace = true }
soils-server = { workspace = true }
soils-physics = { workspace = true }
soils-stdb = { workspace = true }
avian3d = { workspace = true }
# Composed from Bevy's fine-grained features rather than its `default`
# (= 2d + 3d + ui + audio) so the build does not carry subsystems this game
# never touches. Dropped, each verified unused in the source:
#   audio  -> bevy_audio, vorbis, rodio, lewton, ogg, cpal
#   2d     -> bevy_sprite's render path (UI has its own, `bevy_ui_render`)
#   gltf   -> bevy_gltf, gltf_animation (every mesh here is procedural)
#   gilrs  -> gamepad support
# x11/wayland are Linux-only, so they are target-gated below rather than
# listed here — on Windows they are dead weight, and on Linux winit has no
# backend at all without one of them.
bevy = { version = "0.19", default-features = false, features = [
    # default_app
    "async_executor", "bevy_asset", "bevy_log", "bevy_state", "reflect_auto_register",
    # default_platform, minus bevy_gilrs and the Linux window backends
    "std", "bevy_winit", "bevy_clipboard", "default_font", "multi_threaded",
    "webgl2", "custom_cursor", "sysinfo_plugin",
    # 3d_bevy_render, minus bevy_gltf and gltf_animation
    "3d_api", "bevy_render", "bevy_core_pipeline", "bevy_gizmos_render",
    "bevy_anti_alias", "bevy_pbr", "bevy_post_process",
    # ui
    "ui_api", "bevy_ui_render", "bevy_ui_widgets",
    # shared by the meta-features above
    "scene", "picking",
] }
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
wtransport = { version = "0.7.1", features = ["dangerous-configuration"] }
bytemuck = "1"

# Without a window backend winit fails to compile on Linux outright
# (`compile_error!("The platform you're compiling for is not supported by
# winit")`), which is what broke every Linux CI job after the feature list was
# trimmed for Bevy 0.19. Cargo unions features for the same dependency, so this
# adds them only when the target is Linux and leaves the Windows build byte for
# byte as it was.
[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "0.19", default-features = false, features = ["x11", "wayland"] }

[dev-dependencies]
# Headless GPU test: run the radiance-cascades compute shader on a real device
# (no window/surface) and compare its output against the CPU oracle.
wgpu = "29"
pollster = "0.4"
glam = { workspace = true }
