# Block ids are assigned by declaration order (Air=0, Dirt=1, ...) — never
# reorder without re-pinning everything that stores a raw id.
#
# `category`/`function`/`effect`/`weight` describe the block *as an item*: which
# row it lands in on the inventory screen, and what may stand in for it when a
# hotbar slot runs dry. All optional; omitted means stone/place/none/1.0.
Air:
  faces: [0, 0, 0]
Dirt:
  faces: [1, 1, 1]
  category: earth
Grass:
  faces: [3, 2, 1]
  category: earth
Stone:
  faces: [4, 4, 4]
  category: stone
  weight: 1.4
Cobblestone:
  faces: [5, 5, 5]
  category: stone
  weight: 1.4
Moss Stone:
  faces: [6, 6, 6]
  category: stone
  weight: 1.4
Iron Ore:
  faces: [7, 7, 7]
  category: ore
  weight: 2.2
Copper Ore:
  faces: [8, 8, 8]
  category: ore
  weight: 2.0
Diamond Ore:
  faces: [9, 9, 9]
  emission: [0.6, 3.6, 4.8]
  category: ore
  weight: 2.4
Coal Ore:
  faces: [10, 10, 10]
  category: ore
  weight: 1.8
Ruby Ore:
  faces: [11, 11, 11]
  emission: [5.0, 0.4, 0.7]
  category: ore
  weight: 2.4
Stone Bricks:
  faces: [12, 12, 12]
  category: stone
  weight: 1.4
Slate:
  faces: [13, 13, 13]
  category: stone
  weight: 1.6
Tough Dirt:
  faces: [14, 14, 14]
  category: earth
  weight: 1.2
Rocky Dirt:
  faces: [15, 15, 15]
  category: earth
  weight: 1.2
Wooden Crate:
  faces: [17, 16, 17]
  category: crafted
  weight: 3.0
  # Three rows of nine. `container` is what makes a block openable at all —
  # the server refuses to open anything without it.
  container: 27
Clay Pot:
  faces: [18, 19, 20]
  category: crafted
  container: 9
  weight: 1.5
Log:
  faces: [23, 21, 23]
  category: organic
  weight: 0.8
Leaves:
  faces: [22, 22, 22]
  category: organic
  weight: 0.1
