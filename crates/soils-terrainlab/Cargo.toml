[package]
name = "soils-terrainlab"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
soils-worldgen = { workspace = true }
soils-protocol = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
bevy = "0.19"
# bevy_egui 0.41 targets Bevy 0.19 and pins egui 0.35.
# Keep these two in lockstep on any Bevy bump (see docs/analysis.md upgrade note).
bevy_egui = "0.41"
# Direct egui pin must equal the version bevy_egui bundles, so there is exactly
# one egui in the graph. (egui-snarl was dropped: its only egui-0.33 release
# rendered blank under bevy_egui 0.39; the node canvas is hand-rolled on
# egui::Scene instead — see crates/soils-terrainlab/src/canvas.rs.)
egui = "0.35"
ron = "0.8"
rfd = "0.15"
bytemuck = "1"

[dev-dependencies]
wgpu = "29"
pollster = "0.4"
